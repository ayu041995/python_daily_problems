apiVersion: v1
kind: Pod
metadata:
  name: simple-webapp-colour
  label:
    name: simple-webapp-colour
data:
  containers:
    - name: simple-webapp-colour
      image: simple-webapp-colour
      ports:
        - containerPort: 8080 
      resources:
        requests:
          memory: 2000Mi
          cpu: 1000m
        limits:
          memory: 3000Mi
          cpu: 1500m
      envFrom:
        - configMapRef:
              name: app-config


